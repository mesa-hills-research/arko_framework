[package]
name = "arko-ai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "All-in-one Rust crate for interfacing with LLMs from various providers"
license.workspace = true

[dependencies]
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
base64 = "0.22"
url = "2.4"
log.workspace = true
futures.workspace = true
tokio-stream = { version = "0.1", features = ["full"] }
bytes = "1.5"
async-stream = "0.3"
eventsource-stream = "0.2.3"
# esaxx_fast (Unigram training only) links C++ built against the static CRT,
# which conflicts with Rust's dynamic CRT on MSVC (LNK4098).
tokenizers = { version = "0.23.2", default-features = false, features = ["http", "onig", "progressbar"] }
httpdate = "1.0"
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
clap.workspace = true
dotenv.workspace = true
env_logger.workspace = true

[[example]]
name = "llm_client_cli"

[[example]]
name = "embeddings_demo"
