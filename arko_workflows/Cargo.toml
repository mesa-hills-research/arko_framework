[package]
name = "arko_workflows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Multi-agent workflow orchestration built on arko_agents"
license.workspace = true

[features]
default = []
python = ["pyo3", "pyo3-async-runtimes"]

[dependencies]
arko_ai.workspace = true
arko_agents.workspace = true

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid = { workspace = true, features = ["serde"] }
chrono.workspace = true
log.workspace = true
parking_lot = "0.12"
sha2.workspace = true
base64 = "0.22"

pyo3 = { version = "0.27.2", features = ["extension-module"], optional = true }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"], optional = true }

[lib]
name = "arko_workflows"
crate-type = ["lib"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
env_logger.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["test-util"] }
