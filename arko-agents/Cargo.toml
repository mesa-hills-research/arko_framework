[package]
name = "arko-agents"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Rust crate for LLM Agents and Tools"
license = "MIT OR Apache 2.0"
readme = "README.md"

[dependencies]
arko-ai = { path = "../arko-ai" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
serde_yaml = "0.9"
thiserror = "1.0.58"
tokio = { version = "1.37.0", features = ["full"] }
async-trait = "0.1.79"
chrono = { version = "0.4.38", features = ["serde"] }
log = "0.4.21"
futures = "0.3.30"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
ignore = "0.4.22"
regex = "1.10.4"
shellexpand = "3.1.0"
rmcp = { version = "1.1.0", features = ["client", "transport-child-process"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
dotenv = "0.15"
env_logger = "0.10"
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread", "test-util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["term", "process", "signal", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
