[package]
name = "arko_agents"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Rust crate for LLM Agents and Tools"
license.workspace = true
readme = "README.md"

[dependencies]
arko_ai.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
chrono.workspace = true
log.workspace = true
futures.workspace = true
uuid = { workspace = true, features = ["serde"] }
walkdir = "2.5.0"
ignore.workspace = true
regex = "1.10.4"
shellexpand = "3.1.0"
rmcp = { version = "1.1.0", features = ["client", "transport-child-process"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
clap.workspace = true
dotenv.workspace = true
env_logger.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["term", "process", "signal", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
