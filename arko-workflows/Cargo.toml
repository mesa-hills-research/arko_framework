[package]
name = "arko-workflows"
version = "0.1.0"
edition = "2024"
description = "Multi-agent workflow orchestration built on arko_agents"
license = "MIT OR Apache-2.0"

[features]
default = []
python = ["pyo3", "pyo3-async-runtimes"]

[dependencies]
arko-ai = { path = "../arko-ai" }
arko-agents = { path = "../arko-agents" }

tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
parking_lot = "0.12"
sha2 = "0.10"

pyo3 = { version = "0.27.2", features = ["extension-module"], optional = true }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"], optional = true }

[lib]
name = "arko_workflows"
crate-type = ["lib"]

[dev-dependencies]
env_logger = "0.10"
clap = { version = "4.5", features = ["derive"] }
