[package]
name = "arko-index"
version = "0.2.0"
edition = "2024"
description = "Incremental source indexing with validated model boundaries and local hybrid retrieval"
license = "MIT OR Apache-2.0"

[dependencies]
arko-ai = { path = "../arko-ai" }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.30", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ignore = "0.4"
glob = "0.3"
notify = "6.1"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
pulldown-cmark = "0.13"
# Without esaxx_fast; see arko-ai/Cargo.toml (static CRT conflicts on MSVC).
tokenizers = { version = "0.23.2", default-features = false, features = ["http", "onig", "progressbar"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
clap = { version = "4.5", features = ["derive"] }
