[package]
name = "arko_ai"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "Clients for language models from OpenAI, Anthropic, Google Gemini, OpenRouter and Claude Code, with streaming, tool calls, usage and cost"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "ai", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
# TLS is rustls with the ring provider (already compiled for tokenizer
# downloads) and the OS trust store. reqwest's default backend would add
# aws-lc, another C build; CI rejects aws-lc and OpenSSL.
# No http2 feature: requests use HTTP/1.1, as they did with reqwest 0.11.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "charset", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
base64 = "0.22"
# Shrinks images over a provider's limits; pure Rust codecs only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
url = "2.4"
log.workspace = true
futures.workspace = true
tokio-stream = { version = "0.1", features = ["full"] }
bytes = "1.5"
async-stream = "0.3"
eventsource-stream = "0.2.3"
# esaxx_fast (Unigram training only) links C++ built against the static CRT,
# which conflicts with Rust's dynamic CRT on MSVC (LNK4098).
tokenizers = { version = "0.23.2", default-features = false, features = ["http", "onig", "progressbar"] }
httpdate = "1.0"
uuid.workspace = true
sha2.workspace = true

# The Claude Code CLI runs in its own process group (Unix) or job object
# (Windows), so the programs it starts stop with it.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
clap.workspace = true
dotenv.workspace = true
env_logger.workspace = true
tempfile.workspace = true

[[example]]
name = "llm_client_cli"
# Its unit tests run with `cargo test`.
test = true

[[example]]
name = "embeddings_demo"

[[example]]
name = "oauth_cache_probe"
