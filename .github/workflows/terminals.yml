name: Framework portability
on: [push, pull_request, workflow_dispatch]
# A newer push to the same branch cancels its older run. Every commit that
# reaches main is still tested to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Caches the cargo registry and compiled dependencies. Only main saves,
      # so branches reuse main's cache without filling the per-repo limit.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Keeps aws-lc and OpenSSL out of the dependency graph. --all-features
      # also resolves optional dependencies (e.g. arko_workflows' pyo3 bindings).
      - name: Reject aws-lc and OpenSSL builds
        if: runner.os == 'Linux'
        run: |
          cargo metadata --locked --all-features --format-version 1 > "$RUNNER_TEMP/metadata.json"
          banned=$(jq -r '.packages[].name' "$RUNNER_TEMP/metadata.json" | grep -xE 'aws-lc-sys|aws-lc-rs|openssl-sys' || true)
          if [ -n "$banned" ]; then
            echo "::error::Unexpected native dependency: $banned"
            exit 1
          fi
      - name: Framework library tests, including native terminal interactions
        run: cargo test --workspace --lib --locked --no-fail-fast
      - name: Index pipeline and watcher tests
        run: cargo test -p arko_index --locked --no-fail-fast
      - name: Interactive terminal example
        run: cargo run -p arko_agents --example interactive_terminal --locked
