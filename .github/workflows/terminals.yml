name: Framework portability
on: [push, pull_request, workflow_dispatch]
# A newer push to the same branch cancels its older run. Every commit that
# reaches main is still tested to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Test binaries keep line numbers for backtraces but no full debug info. Each
# test file links the whole dependency tree, and with full debug info the
# Linux runner's disk filled up while linking arko_index's tests.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # One exact Rust release, so a new stable release can't change a run's result.
  # It's the newest release at least 30 days old.
  RUST_TOOLCHAIN: 1.99.1
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      # Caches the cargo registry and compiled dependencies. Only main saves,
      # so branches reuse main's cache without filling the per-repo limit.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Keeps aws-lc and OpenSSL out of the dependency graph. --all-features
      # also resolves optional dependencies (e.g. arko_workflows' pyo3 bindings).
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Reject aws-lc and OpenSSL builds
        if: runner.os == 'Linux'
        run: |
          cargo metadata --locked --all-features --format-version 1 > "$RUNNER_TEMP/metadata.json"
          banned=$(jq -r '.packages[].name' "$RUNNER_TEMP/metadata.json" | grep -xE 'aws-lc-sys|aws-lc-rs|openssl-sys' || true)
          if [ -n "$banned" ]; then
            echo "::error::Unexpected native dependency: $banned"
            exit 1
          fi
      - name: Framework library tests, including native terminal interactions
        run: cargo test --workspace --lib --locked --no-fail-fast ${{ runner.os == 'Windows' && '--exclude arko_index' || '' }}
      # With the local embedding models (feature local-embed). The tests that
      # download the models stay ignored.
      - name: Index pipeline, watcher and local model tests
        if: runner.os != 'Windows'
        run: cargo test -p arko_index --features local-embed --locked --no-fail-fast
      # On Windows arko_index is compiled and only its local model tests run: its
      # file locking and atomic renames there are untested.
      - name: Compile arko_index
        if: runner.os == 'Windows'
        run: cargo check -p arko_index --all-targets --features local-embed --locked
      - name: Local model tests
        if: runner.os == 'Windows'
        run: cargo test -p arko_index --features local-embed --lib --locked dense::local
      - name: Compile every workspace target
        if: runner.os == 'Linux'
        run: cargo check --workspace --all-targets --locked
      - name: Interactive terminal example
        run: cargo run -p arko_agents --example interactive_terminal --locked
