[package]
name = "arko_index"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Deterministic tree-sitter source partitioning and durable incremental code search"
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ignore.workspace = true
# mhr_tree_sitter: a pure-Rust port of tree-sitter 0.25.10 and its grammars. The
# libraries keep tree-sitter's names (tree_sitter, tree_sitter_rust, ...). The port pins
# the grammar versions; a grammar upgrade changes chunk boundaries and IDs.
# TODO: local path dependencies until the mhr_tree_sitter repository is published.
mhr_tree_sitter = { path = "/home/local-ubuntu/Desktop/mhr-work/mhr_tree_sitter/runtime" }
mhr_tree_sitter_rust = { path = "/home/local-ubuntu/Desktop/mhr-work/mhr_tree_sitter/grammars/rust" }
mhr_tree_sitter_python = { path = "/home/local-ubuntu/Desktop/mhr-work/mhr_tree_sitter/grammars/python" }
# TypeScript, and TSX (re-exported from mhr_tree_sitter_tsx as LANGUAGE_TSX).
mhr_tree_sitter_typescript = { path = "/home/local-ubuntu/Desktop/mhr-work/mhr_tree_sitter/grammars/typescript" }
mhr_tree_sitter_javascript = { path = "/home/local-ubuntu/Desktop/mhr-work/mhr_tree_sitter/grammars/javascript" }
mhr_tree_sitter_go = { path = "/home/local-ubuntu/Desktop/mhr-work/mhr_tree_sitter/grammars/go" }
mhr_tree_sitter_java = { path = "/home/local-ubuntu/Desktop/mhr-work/mhr_tree_sitter/grammars/java" }
mhr_tree_sitter_c = { path = "/home/local-ubuntu/Desktop/mhr-work/mhr_tree_sitter/grammars/c" }
mhr_tree_sitter_cpp = { path = "/home/local-ubuntu/Desktop/mhr-work/mhr_tree_sitter/grammars/cpp" }
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# The arko_index_cli example stops its watchers on SIGINT and SIGTERM.
ctrlc = { version = "3.5", features = ["termination"] }
# The examples embed with Voyage through arko_ai's client (examples/support/voyage.rs).
# The library itself never depends on arko_ai: it defines the `dense::Embedder` trait.
arko_ai.workspace = true
tokio.workspace = true
