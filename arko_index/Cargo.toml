[package]
name = "arko_index"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Deterministic tree-sitter source partitioning and durable incremental code search"
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ignore.workspace = true
# mhr_tree_sitter: a pure-Rust port of tree-sitter 0.25.10 and its grammars. The
# libraries keep tree-sitter's names (tree_sitter, tree_sitter_rust, ...). The port pins
# the grammar versions; a grammar upgrade changes chunk boundaries and IDs. The
# TypeScript, OCaml and XML crates re-export TSX, OCaml interfaces and DTD.
# All from one pinned commit of https://github.com/mesa-hills-research/mhr_tree_sitter.
mhr_tree_sitter = { git = "https://github.com/mesa-hills-research/mhr_tree_sitter", rev = "d56f6093f18f4212af2ea96588d5ee2318001450" }
