[package]
name = "arko_index"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Deterministic tree-sitter source partitioning and durable incremental code search"
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ignore.workspace = true
tree-sitter = "0.25"
tree-sitter-language = "0.1"
# The grammars are pinned: an upgrade changes chunk boundaries and IDs, and the GCC
# profiles in pgo/ are made for these exact sources (rerun pgo/train.sh after one).
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
fs2 = "0.4"
libc = "0.2"

[features]
default = ["pgo"]
# Compiles the tree-sitter grammars a second time with GCC profile-guided optimization,
# from the profiles in pgo/, and parses with those copies. Applies to optimized builds
# with GCC on x86-64 Linux whose GCC major version and grammar sources match the
# profiles; any other build silently uses the grammar crates' own objects. Output is
# identical either way. Remove with `default-features = false`.
pgo = []

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile.workspace = true
# The arko_index_cli example stops its watchers on SIGINT and SIGTERM.
ctrlc = { version = "3.5", features = ["termination"] }
