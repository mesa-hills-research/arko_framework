[package]
name = "arko_index"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Splits source repositories into chunks along their syntax, searches them lexically, densely or both, and keeps them current with file watchers"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["code-search", "search", "tree-sitter", "embeddings", "bm25"]
categories = ["development-tools", "text-processing"]
# Maintainer scripts that check chunking on whole corpora and regenerate the rules.
exclude = ["scripts/", "tools/"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ignore.workspace = true
# Mesquite: a pure-Rust port of tree-sitter 0.25.10 and its grammars. The
# libraries keep tree-sitter's names (tree_sitter, tree_sitter_rust, ...). The port pins
# the grammar versions; a grammar upgrade changes chunk boundaries and IDs. The
# TypeScript, OCaml and XML crates re-export TSX, OCaml interfaces and DTD.
mesquite = "0.25.10"
mesquite_rust = "0.1.0"
mesquite_python = "0.1.0"
mesquite_typescript = "0.1.0"
mesquite_javascript = "0.1.0"
mesquite_go = "0.1.0"
mesquite_java = "0.1.0"
mesquite_c = "0.1.0"
mesquite_cpp = "0.1.0"
mesquite_astro = "0.1.0"
mesquite_bash = "0.1.0"
mesquite_c_sharp = "0.1.0"
mesquite_cmake = "0.1.0"
mesquite_css = "0.1.0"
mesquite_cuda = "0.1.0"
mesquite_dart = "0.1.0"
mesquite_diff = "0.1.0"
mesquite_elixir = "0.1.0"
mesquite_elm = "0.1.0"
mesquite_embedded_template = "0.1.0"
mesquite_erlang = "0.1.0"
mesquite_fortran = "0.1.0"
mesquite_fsharp = "0.1.0"
mesquite_glsl = "0.1.0"
mesquite_graphql = "0.1.0"
mesquite_haskell = "0.1.0"
mesquite_hcl = "0.1.0"
mesquite_html = "0.1.0"
mesquite_json = "0.1.0"
mesquite_julia = "0.1.0"
mesquite_kotlin = "0.1.0"
mesquite_lua = "0.1.0"
mesquite_make = "0.1.0"
mesquite_markdown = "0.1.0"
mesquite_objc = "0.1.0"
mesquite_ocaml = "0.1.0"
mesquite_odin = "0.1.0"
mesquite_perl = "0.1.0"
mesquite_php = "0.1.0"
mesquite_powershell = "0.1.0"
mesquite_proto = "0.1.0"
mesquite_r = "0.1.0"
mesquite_ruby = "0.1.0"
mesquite_scala = "0.1.0"
mesquite_solidity = "0.1.0"
mesquite_sql = "0.1.0"
mesquite_svelte = "0.1.0"
mesquite_swift = "0.1.0"
mesquite_toml = "0.1.0"
mesquite_verilog = "0.1.0"
mesquite_xml = "0.1.0"
mesquite_yaml = "0.1.0"
mesquite_zig = "0.1.0"
fs2 = "0.4"
libc = "0.2"
# Caprock: the vector store behind dense search (pure, safe Rust).
caprock = "0.1.0"

# The `local-embed` feature: embedding models run on the CPU (`dense::local`), all pure
# Rust. gemm multiplies the f32 matrices, rayon spreads the work over threads, tokenizers
# (with the fancy-regex engine instead of the C Oniguruma one) splits text into tokens.
gemm = { version = "0.19", default-features = false, features = ["std", "rayon", "x86-v4"], optional = true }
# Safe SIMD with run-time dispatch for the int8 kernels (gemm and Caprock use it too).
pulp = { version = "0.22", optional = true }
rayon = { version = "1.10", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
libm = { version = "0.2", optional = true }

# The `local-embed-gpu` and `local-embed-cuda` features: the local models on a GPU, on
# burn's tensors (pure Rust). wgpu runs Vulkan, Metal and DirectX 12. CUDA (through
# cubecl and cudarc) loads the driver and NVRTC when it starts and compiles its kernels at
# run time, so building needs no CUDA toolkit. Both include burn's ndarray backend, on
# which the offline tests run. burn 0.22's CUDA backend downloads LLVM and compiles C
# while building, so these stay on 0.21. burn's operation fusion stays off: its fused
# kernels returned wrong vectors for whole batches of some shapes (an RTX 5090 in f16 at
# 13 x 608 tokens, an L4 in f32 at 16 x 992), which the same graph without fusion did not.
burn-tensor = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }
burn-ndarray = { version = "=0.21.0", default-features = false, features = ["std", "simd", "multi-threads"], optional = true }
burn-wgpu = { version = "=0.21.0", default-features = false, features = ["std", "autotune"], optional = true }
burn-cuda = { version = "=0.21.0", default-features = false, features = ["std", "autotune"], optional = true }
# Finding the adapters (wgpu) and the driver, GPUs and NVRTC (cudarc) before choosing a
# device, and placing cubecl's kernel tuning cache: the versions burn uses.
wgpu = { version = "29", default-features = false, optional = true }
cubecl-runtime = { version = "=0.10.0", default-features = false, features = ["std"], optional = true }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-version-from-build-system", "fallback-latest"], optional = true }

[features]
# Local embedding models (`dense::local`), off by default.
local-embed = ["dep:gemm", "dep:pulp", "dep:rayon", "dep:tokenizers", "dep:libm"]
# Local embedding models on a GPU through wgpu (Vulkan, Metal, DirectX 12), off by default.
local-embed-gpu = ["local-embed", "dep:burn-tensor", "dep:burn-ndarray", "dep:burn-wgpu", "dep:wgpu", "dep:cubecl-runtime"]
# Local embedding models on an NVIDIA GPU through CUDA, off by default.
local-embed-cuda = ["local-embed", "dep:burn-tensor", "dep:burn-ndarray", "dep:burn-cuda", "dep:cudarc", "dep:cubecl-runtime"]

[[example]]
name = "local_embed_bench"
required-features = ["local-embed"]

[[example]]
name = "local_embed_device_bench"
required-features = ["local-embed"]

[[test]]
name = "local_embed"
required-features = ["local-embed"]

[dev-dependencies]
tempfile.workspace = true
# The arko_index_cli example stops its watchers on SIGINT and SIGTERM.
ctrlc = { version = "3.5", features = ["termination"] }
# The examples embed with Voyage through arko_ai's client (examples/support/voyage.rs).
# The library itself never depends on arko_ai: it defines the `dense::Embedder` trait.
arko_ai.workspace = true
tokio.workspace = true
# With `--features local-embed`, the examples download local models into the Hugging
# Face cache. The configuration arko_ai's tokenizers already builds.
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
